<!DOCTYPE html>

    <title>Dashboard — Threat Detection System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

                    <p><a href="/admin">Admin Panel</a></p>
                    <p><a href="/api/data">API Data</a></p>
                </div>
